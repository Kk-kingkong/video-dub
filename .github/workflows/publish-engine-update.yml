name: Publish verified Engine update

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable draft tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: engine-update-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-update:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private draft and then publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/promote_engine_release.py --tag "$RELEASE_TAG"

  verify-update:
    if: ${{ github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Recheck a published stable update without writes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/promote_engine_release.py --tag "$RELEASE_TAG" --verify-only
